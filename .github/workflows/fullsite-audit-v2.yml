name: Fullsite Visual Audit V2

on:
  push:
    branches:
      - assistant/fullsite-audit-772c70c
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start Vite
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/dl-vite.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dl-vite.log
          exit 1
      - name: Capture real site
        run: |
          mkdir -p audit
          cat > audit-site.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
          const errors = [];
          page.on('pageerror', e => errors.push('pageerror: ' + e.message));
          page.on('console', m => { if (m.type() === 'error') errors.push('console: ' + m.text()); });
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          await page.waitForTimeout(2500);
          const shot = async name => { await page.waitForTimeout(500); await page.screenshot({ path:`audit/${name}.png` }); };
          const scroll = async y => { await page.evaluate(v=>scrollTo(0,v), y); await page.waitForTimeout(900); };
          const metrics = await page.evaluate(() => {
            const h=document.querySelector('.hero');
            return { heroTop:h.getBoundingClientRect().top+scrollY, heroHeight:h.getBoundingClientRect().height, vh:innerHeight, page:document.documentElement.scrollHeight };
          });
          await scroll(0); await shot('00-hero-rest');
          await page.mouse.move(940,360,{steps:20}); await page.waitForTimeout(800); await shot('01-hero-hover');
          await page.mouse.move(50,850); await page.waitForTimeout(700);
          const travel=Math.max(0,metrics.heroHeight-metrics.vh);
          for(const [n,p] of [['02-hero-approach',.42],['03-hero-cross',.82],['04-hero-exit',.98]]) { await scroll(metrics.heroTop+travel*p); await shot(n); }
          for(const [n,s] of [['05-thesis','#thesis'],['06-desk42','[data-movement="desk42"]'],['07-brawler','[data-movement="brawler"]'],['08-technology','[data-movement="foundation"]'],['09-company','[data-movement="studio"]'],['10-contact','[data-movement="resolution"]']]) {
            const y=await page.evaluate(sel=>{const e=document.querySelector(sel); return e?e.getBoundingClientRect().top+scrollY:null},s);
            if(y!==null){await scroll(Math.max(0,y));await shot(n);}
          }
          await page.evaluate(()=>scrollTo(0,0)); await page.waitForTimeout(500); await page.screenshot({path:'audit/11-fullpage.png',fullPage:true});
          const mobile=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          const mobileErrors=[]; mobile.on('pageerror',e=>mobileErrors.push('pageerror: '+e.message)); mobile.on('console',m=>{if(m.type()==='error')mobileErrors.push('console: '+m.text())});
          await mobile.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'}); await mobile.waitForTimeout(2500); await mobile.screenshot({path:'audit/12-mobile-hero.png'});
          const ty=await mobile.evaluate(()=>{const e=document.querySelector('#thesis');return e?e.getBoundingClientRect().top+scrollY:0}); await mobile.evaluate(y=>scrollTo(0,y),ty); await mobile.waitForTimeout(900); await mobile.screenshot({path:'audit/13-mobile-thesis.png'});
          await fs.writeFile('audit/report.json',JSON.stringify({metrics,errors,mobileErrors},null,2));
          await browser.close();
          EOF
          xvfb-run -a node audit-site.mjs
      - name: Save Vite log
        if: always()
        run: cp /tmp/dl-vite.log audit/vite.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fullsite-audit-772c70c-v2
          path: audit
          retention-days: 3
