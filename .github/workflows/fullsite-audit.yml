name: Fullsite Visual Audit

on:
  push:
    branches:
      - assistant/fullsite-audit-772c70c
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start Vite
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/dl-vite.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dl-vite.log
          exit 1
      - name: Capture real site
        run: |
          mkdir -p audit
          cat > /tmp/audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          const base = 'http://127.0.0.1:4173';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
          const errors = [];
          page.on('pageerror', e => errors.push('pageerror: ' + e.message));
          page.on('console', m => { if (m.type() === 'error') errors.push('console: ' + m.text()); });
          await page.goto(base + '/', { waitUntil: 'networkidle' });
          await page.waitForTimeout(2500);

          async function shot(name) {
            await page.waitForTimeout(500);
            await page.screenshot({ path: `audit/${name}.png`, type: 'png' });
          }
          async function scrollToY(y) {
            await page.evaluate(y => window.scrollTo(0, y), y);
            await page.waitForTimeout(800);
          }

          const metrics = await page.evaluate(() => {
            const hero = document.querySelector('.hero');
            const moves = [...document.querySelectorAll('[data-movement]')].map(el => ({
              movement: el.getAttribute('data-movement'),
              id: el.id || null,
              top: Math.round(el.getBoundingClientRect().top + scrollY),
              height: Math.round(el.getBoundingClientRect().height),
            }));
            return {
              scrollHeight: document.documentElement.scrollHeight,
              heroTop: hero ? hero.getBoundingClientRect().top + scrollY : 0,
              heroHeight: hero ? hero.getBoundingClientRect().height : innerHeight,
              innerHeight,
              moves,
            };
          });

          await scrollToY(0); await shot('00-hero-rest');
          // Ambient hover over the visible entity, no click.
          await page.mouse.move(930, 370, { steps: 18 });
          await page.waitForTimeout(700); await shot('01-hero-hover');
          await page.mouse.move(80, 820, { steps: 12 });
          await page.waitForTimeout(800);

          const travel = Math.max(0, metrics.heroHeight - metrics.innerHeight);
          for (const [name, p] of [['02-hero-approach', 0.42], ['03-hero-cross', 0.82], ['04-hero-exit', 0.98]]) {
            await scrollToY(metrics.heroTop + travel * p);
            await shot(name);
          }

          const targets = [
            ['05-thesis', '#thesis'],
            ['06-desk42', '[data-movement="desk42"]'],
            ['07-brawler', '[data-movement="brawler"]'],
            ['08-technology', '[data-movement="foundation"]'],
            ['09-company', '[data-movement="studio"]'],
            ['10-contact', '[data-movement="resolution"]'],
          ];
          for (const [name, sel] of targets) {
            const y = await page.evaluate(sel => {
              const el = document.querySelector(sel);
              return el ? el.getBoundingClientRect().top + scrollY : null;
            }, sel);
            if (y !== null) { await scrollToY(Math.max(0, y)); await shot(name); }
          }

          // Full page for rhythm, at low resolution via browser screenshot.
          await page.evaluate(() => window.scrollTo(0, 0));
          await page.waitForTimeout(500);
          await page.screenshot({ path: 'audit/11-fullpage.png', fullPage: true, type: 'png' });

          // Mobile first fold and thesis.
          const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
          const mobileErrors = [];
          mobile.on('pageerror', e => mobileErrors.push('pageerror: ' + e.message));
          mobile.on('console', m => { if (m.type() === 'error') mobileErrors.push('console: ' + m.text()); });
          await mobile.goto(base + '/', { waitUntil: 'networkidle' });
          await mobile.waitForTimeout(2500);
          await mobile.screenshot({ path: 'audit/12-mobile-hero.png', type: 'png' });
          const ty = await mobile.evaluate(() => { const el = document.querySelector('#thesis'); return el ? el.getBoundingClientRect().top + scrollY : 0; });
          await mobile.evaluate(y => window.scrollTo(0, y), ty);
          await mobile.waitForTimeout(800);
          await mobile.screenshot({ path: 'audit/13-mobile-thesis.png', type: 'png' });

          await fs.writeFile('audit/report.json', JSON.stringify({ metrics, errors, mobileErrors }, null, 2));
          await browser.close();
          EOF
          xvfb-run -a node /tmp/audit.mjs
      - name: Save Vite log
        if: always()
        run: cp /tmp/dl-vite.log audit/vite.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fullsite-audit-772c70c
          path: audit
          retention-days: 3
